version: "3.9"

services:
  db:
    image: postgres:16
    container_name: my-postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ml:
    # image: ml:latest
    image: ml:realise
    container_name: ml-service
    restart: always
    ports:
      - "8000:8000"

volumes:
  postgres-data:
    external: true